[package]
name = "lattice-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Core Team"]
description = "Zero-copy WebAssembly bridge for neon-lattice simulation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lattice-core = { path = "../lattice-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
